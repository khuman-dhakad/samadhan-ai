server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: samadhan-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/samadhan}
    username: ${DATABASE_USERNAME:samadhan}
    password: ${DATABASE_PASSWORD:samadhan}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  images:
    upload-dir: ${IMAGE_UPLOAD_DIR:./uploads}
