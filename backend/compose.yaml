services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: samadhan
      POSTGRES_USER: samadhan
      POSTGRES_PASSWORD: samadhan
    ports:
      - "5432:5432"
    volumes:
      - samadhan-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samadhan -d samadhan"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/samadhan
      DATABASE_USERNAME: samadhan
      DATABASE_PASSWORD: samadhan
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      IMAGE_UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - samadhan-uploads:/app/uploads

volumes:
  samadhan-postgres:
  samadhan-uploads:
